name: Browser checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also run optional screenshot comparisons
        type: boolean
        default: false

jobs:
  chromium:
    # Retain the existing check name for branch-protection compatibility.
    name: Chromium visual tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Cache imagetools transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: ${{ runner.os }}-imagetools-${{ hashFiles('src/assets/images/**/*.jpg', 'src/**/*.{ts,tsx}', 'vite.config.ts', 'vite.imagetools.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-imagetools-

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run functional browser tests
        run: vp run test:browser:ci

      - name: Run optional screenshot comparisons
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: vp run test:visual

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
