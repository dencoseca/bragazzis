name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Cache imagetools transforms
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/imagetools
          key: ${{ runner.os }}-imagetools-${{ hashFiles('src/assets/images/**/*.jpg', 'src/**/*.{ts,tsx}', 'vite.config.ts', 'vite.imagetools.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-imagetools-

      - name: Run Vite+ checks
        run: vp check

      - name: Run tests
        run: vp test

      - name: Build production app
        run: vp build
