name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Fingerprint image requests
        id: image-requests
        run: |
          git grep -hoE '"([^"]+\.jpg\?[^"]+|[^"]*\*\.jpg|\?preset=[^"]+)"' -- ':(glob)src/**/*.ts' ':(glob)src/**/*.tsx' |
            LC_ALL=C sort -u | sha256sum | awk '{ print "hash=" $1 }' >> "$GITHUB_OUTPUT"

      - name: Cache imagetools transforms
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vite.imagetools.ts') }}-${{ hashFiles('src/assets/images/**/*.jpg') }}-${{ steps.image-requests.outputs.hash }}
          restore-keys: |
            imagetools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'vite.imagetools.ts') }}-

      - name: Run Vite+ checks
        run: vp check

      - name: Run tests
        run: vp test

      - name: Build production app
        run: vp run build
